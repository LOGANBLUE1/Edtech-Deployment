name: Code Review

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  code-quality-check:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      
      # Client checks
      - name: Install client dependencies
        run: |
          cd client
          npm ci
      
      - name: Check client code formatting with Prettier
        run: |
          cd client
          npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,scss,md}"
        continue-on-error: true
      
      - name: Build client application
        run: |
          cd client
          npm run build
        env:
          CI: false
      
      - name: Run client tests
        run: |
          cd client
          npm test -- --passWithNoTests --watchAll=false
        continue-on-error: true
      
      # Server checks
      - name: Install server dependencies
        run: |
          cd server
          npm ci
      
      - name: Check server for syntax errors
        run: |
          cd server
          node -c index.js
      
      - name: Validate server package.json
        run: |
          cd server
          npm ls --depth=0
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
      
      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      
      - name: Run npm audit on client
        run: |
          cd client
          npm audit --audit-level=high
        continue-on-error: true
      
      - name: Run npm audit on server
        run: |
          cd server
          npm audit --audit-level=high
        continue-on-error: true

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build client Docker image
        run: |
          docker build -t edtech-client:test ./client
      
      - name: Build server Docker image
        run: |
          docker build -t edtech-server:test ./server
      
      - name: Verify docker-compose configuration
        run: |
          docker-compose config

  summary:
    name: Review Summary
    runs-on: ubuntu-latest
    needs: [code-quality-check, security-scan, docker-build-check]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          echo "Code Quality Check: ${{ needs.code-quality-check.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Docker Build Check: ${{ needs.docker-build-check.result }}"
          
          if [ "${{ needs.code-quality-check.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.docker-build-check.result }}" != "success" ]; then
            echo "⚠️ Some checks failed or were skipped. Please review the logs above."
            exit 1
          else
            echo "✅ All code review checks passed successfully!"
          fi
